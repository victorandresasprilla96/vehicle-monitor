<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Monitor de vehículo en tiempo real para centrales de operaciones de flota."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f5f8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Map tiles: open the connection early. No crossorigin: Leaflet loads tiles as
         plain (non-CORS) images, which would not reuse a CORS preconnect. -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <title>Monitor de flota</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      // Keep the storage key and colors in sync with src/theme/theme.ts.
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('vm-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0a0e13' : '#f3f5f8')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
